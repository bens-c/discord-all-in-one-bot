services:
  - type: web
    name: discord-all-in-one-dashboard
    runtime: node
    plan: free
    branch: web-dashboard
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://discord-all-in-one-dashboard.onrender.com/api/auth/callback/discord
      - key: SESSION_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kyrox_bot
