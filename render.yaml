services:
  - type: web
    name: discord-all-in-one-dashboard
    runtime: node
    plan: free
    branch: web-dashboard
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DASHBOARD_ACCESS_KEY
        sync: false
